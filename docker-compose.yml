networks:
  qsync-network:
    driver: bridge

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

services:
  # ============================================================================
  # PostgreSQL: Transactional ACID Storage (Bookings, Events, Outbox table)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: qsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qsync_secret}
      POSTGRES_DB: ${POSTGRES_DB:-qsync_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qsync} -d ${POSTGRES_DB:-qsync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsync-network

  # ============================================================================
  # Redis: Distributed Locks (Atomic Lua Seat Hold, Cache, Rate Limiting)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: qsync-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secret}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - qsync-network

  # ============================================================================
  # Apache Kafka (KRaft mode): Event Streaming & Saga Choreography
  # ============================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: qsync-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      # KRaft cluster configuration (Zero Zookeeper dependency)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST:-localhost}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks:
      - qsync-network
